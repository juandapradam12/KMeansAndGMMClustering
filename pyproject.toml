[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-gmm-clustering"
version = "1.1.0"
description = "From-scratch K-Means, Soft K-Means, GMM, DBSCAN, and hierarchical clustering with sklearn benchmarks."
readme = "README.md"
authors = [
  { name = "Juan David Prada Malagón", email = "pradamalagonjd@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]
keywords = ["clustering", "kmeans", "gmm", "dbscan", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.8", "jupyter>=1.0"]

[project.scripts]
cluster-bench = "clustering.cli:main"

[project.urls]
Homepage = "https://github.com/juandapradam12/KMeansAndGMMClustering"
Repository = "https://github.com/juandapradam12/KMeansAndGMMClustering"

[tool.setuptools.packages.find]
include = ["clustering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
